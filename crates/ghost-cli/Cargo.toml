[package]
name = "ghost-layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Ghost Layer (`ghost`): unlink your Zcash payments from your wallet sync. Split broadcast, random delay, grid-aligned sync, Nym by default; ZecProof, Ghost Wallet, MCP server."
readme = "README.md"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
ghost-transport = { package = "ghost-layer-transport", path = "../ghost-transport", version = "0.2.1" }
ghost-gateway = { package = "ghost-layer-gateway", path = "../ghost-gateway", version = "0.2.1" }
tonic.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ghost-core = { package = "ghost-layer-core", path = "../ghost-core", version = "0.2.1" }
hex.workspace = true
ghost-attacker = { package = "ghost-layer-attacker", path = "../ghost-attacker", version = "0.2.1" }
rmcp.workspace = true
schemars.workspace = true
zcash_client_backend.workspace = true
zcash_keys.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
orchard.workspace = true
zcash_note_encryption.workspace = true
base64.workspace = true
rand.workspace = true
# Nym built in (default). crates.io nym-sdk 1.21.6 only builds with every nym-* crate at 1.21.6: see
# scripts/pin_nym.sh; install with `cargo install --locked ghost-layer` to use our lockfile.
nym-sdk = { version = "1.21.6", optional = true }

[dev-dependencies]
jsonschema = "0.33.0"

[features]
default = ["embedded-nym"]
# Run the two Nym SOCKS5 clients inside `ghost` (no separate nym-socks5-client needed)
embedded-nym = ["dep:nym-sdk"]
