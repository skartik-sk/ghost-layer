[package]
name = "zip311"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "ZIP 311 Zcash payment disclosures: prove you sent a shielded payment (Orchard/Ironwood spend authority + output disclosure), and verify it against the chain."
readme = "README.md"
keywords = ["zcash", "zip311", "payment-disclosure", "orchard", "privacy"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
orchard = { workspace = true, features = ["circuit", "multicore", "std"] }
sapling = { package = "sapling-crypto", version = "0.9.0", default-features = false, features = ["std"] }
zcash_note_encryption.workspace = true
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
blake2b_simd = "1.0.5"
base64.workspace = true
rand.workspace = true


[features]
default = ["tx"]
# `TxData::from_tx` and `coin_type` for `zcash_primitives` transactions. Turn off to use the core API
# with another librustzcash version (orchard and sapling-crypto types are all it needs).
tx = ["dep:zcash_primitives", "dep:zcash_protocol"]

[dev-dependencies]
incrementalmerkletree = "0.9.0"
