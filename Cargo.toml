[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/skartik-sk/ghost-layer"
homepage = "https://github.com/skartik-sk/ghost-layer"
keywords = ["zcash", "privacy", "lightwalletd", "nym", "mixnet"]
categories = ["cryptography::cryptocurrencies", "network-programming", "command-line-utilities"]
rust-version = "1.85"

[workspace.dependencies]
tonic = { version = "0.14.9", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tokio-socks = "0.5.3"
tokio-rustls = "0.26.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = "0.5.3"
http = "1.5.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
futures = "0.3.34"
# librustzcash stable releases with NU7 + Ironwood support (crates.io).
zcash_primitives = { version = "0.31.0", default-features = false, features = ["std"] }
zcash_protocol = "0.11.0"
zcash_client_backend = { version = "0.25.0", features = ["orchard"] }
zcash_keys = { version = "0.17.0", features = ["orchard", "sapling"] }
hex = "0.4"
sha2 = "0.10"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
orchard = { version = "0.16.0", default-features = false }
zcash_note_encryption = "0.5.1"
base64 = "0.23.1"
# Nym's network-wide sync grid (no I/O). crates.io 1.21.6: grid.rs identical to develop @ e416f724.
nym-swizzle-zcash = { version = "1.21.6", default-features = false }
