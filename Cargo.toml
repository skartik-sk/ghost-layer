[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tonic = { version = "0.14.9", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tokio-socks = "0.5.3"
tokio-rustls = "0.26.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = "0.5.3"
http = "1.5.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
futures = "0.3.34"
# librustzcash pinned to the same NU7/Ironwood-capable rev that zcash-devtool uses.
zcash_primitives = { version = "0.31.0-pre.2", default-features = false, features = ["std"] }
zcash_protocol = "0.11.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard", "sapling"] }
hex = "0.4"
sha2 = "0.10"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
orchard = { version = "0.16.0", default-features = false }
zcash_note_encryption = "0.5.1"
base64 = "0.23.1"
# Nym's network-wide sync grid (no I/O). Pinned: develop HEAD on 2026-11-04.
nym-swizzle-zcash = { git = "https://github.com/nymtech/nym", rev = "e416f724ad4f6b7ebb1f91d3ceeb9e64543526bd", default-features = false }

[patch.crates-io]
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zip321 = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
